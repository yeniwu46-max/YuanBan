# Managed for the YuanBanBan static demonstration only.
server {
    listen 80;
    server_name ybb.wuyeni.cn;
    include /var/www/yuanbanban-ybb/nginx-security.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yuanbanban-ybb/acme;
        try_files $uri =404;
    }
    location / { return 301 https://ybb.wuyeni.cn$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name ybb.wuyeni.cn;
    ssl_certificate /etc/letsencrypt/live/ybb.wuyeni.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ybb.wuyeni.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/yuanbanban-ybb/current;
    index index.html;
    autoindex off;
    expires -1;
    include /var/www/yuanbanban-ybb/nginx-security.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz { default_type text/plain; return 200 "ok: yuanbanban demo\n"; }
    location ^~ /assets/ { alias /var/www/yuanbanban-ybb/shared-assets/; expires 1y; }
    location ^~ /api/ { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
